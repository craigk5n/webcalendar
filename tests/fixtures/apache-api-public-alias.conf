<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /tmp/webcalendar-api-smoke/public
    <Directory /tmp/webcalendar-api-smoke>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        php_flag display_errors On
        <Files "api.php">
            CGIPassAuth On
        </Files>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
