name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:

concurrency:
  # A literal prefix, not ${{ github.workflow }}: inside a reusable
  # workflow that expression is the CALLER's name, so every workflow
  # release.yml calls landed in one group and GitHub cancelled the
  # older pending one. Keep this unique per file.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      credential-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: api_credential_test
          POSTGRES_USER: credential_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credential_test -d api_credential_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEBCALENDAR_API_TEST_POSTGRES_HOST: 127.0.0.1
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    name: PHPUnit (PHP ${{ matrix.php-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql, pgsql
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPUnit Tests
        run: vendor/bin/phpunit -c tests/phpunit.xml
      - name: Wizard validation race guard (#728)
        if: matrix.php-version == '8.4'
        run: node tests/wizard-validation-race.js

  apache-api:
    runs-on: ubuntu-24.04
    name: Apache bearer-token smoke test
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test API through Apache with disposable SQLite storage
        run: sh tests/run-api-apache-tests.sh

  mysql-password-proof:
    runs-on: ubuntu-24.04
    name: MySQL password-proof compatibility
    services:
      mysql:
        image: mariadb:13.0.2
        env:
          MARIADB_DATABASE: password_compatibility_test
          MARIADB_USER: password_test
          MARIADB_PASSWORD: synthetic-test-password
          MARIADB_ROOT_PASSWORD: synthetic-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, pdo_mysql
      - name: Verify narrow non-strict storage and concurrent hash replacement
        env:
          WEBCALENDAR_PASSWORD_TEST_MYSQL_HOST: 127.0.0.1
        run: php tests/fixtures/mysql-password-compatibility.php
