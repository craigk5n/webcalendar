name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:

concurrency:
  # A literal prefix, not ${{ github.workflow }}: inside a reusable
  # workflow that expression is the CALLER's name, so every workflow
  # release.yml calls landed in one group and GitHub cancelled the
  # older pending one. Keep this unique per file.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    name: PHPUnit (PHP ${{ matrix.php-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPUnit Tests
        run: vendor/bin/phpunit -c tests/phpunit.xml
      - name: Wizard validation race guard (#728)
        if: matrix.php-version == '8.4'
        run: node tests/wizard-validation-race.js
