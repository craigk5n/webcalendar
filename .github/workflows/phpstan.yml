name: PHPStan Static Analysis

on:
  push:
    branches: [ master, release ]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # A literal prefix, not ${{ github.workflow }}: inside a reusable
  # workflow that expression is the CALLER's name, so every workflow
  # release.yml calls landed in one group and GitHub cancelled the
  # older pending one. Keep this unique per file.
  group: phpstan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan (Level 0)
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
