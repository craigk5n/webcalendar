name: Test WebCalendar Web-Based Installer

on:
  push:
    branches: [ master, release ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_web_wizard_install:
    name: Test WebCalendar wizard fresh installation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite
          tools: none

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 curl net-tools

      - name: Verify required files exist
        run: |
          test -f wizard/index.php || { echo "Missing wizard/index.php"; exit 1; }
          test -f tests/web-install-test.sh || { echo "Missing tests/web-install-test.sh"; exit 1; }
          echo "All required files present."

      - name: Run web-based installer test
        run: |
          chmod +x tests/web-install-test.sh
          ./tests/web-install-test.sh --cleanup

  test_web_wizard_upgrade:
    name: Test WebCalendar wizard upgrade from v1.3.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite
          tools: none

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 curl net-tools

      - name: Verify required files exist
        run: |
          test -f wizard/index.php || { echo "Missing wizard/index.php"; exit 1; }
          test -f tests/web-upgrade-test.sh || { echo "Missing tests/web-upgrade-test.sh"; exit 1; }
          test -f tests/fixtures/v1.3.0-schema-sqlite3.sql || { echo "Missing SQL fixture"; exit 1; }
          echo "All required files present."

      - name: Run web-based upgrade test
        run: |
          chmod +x tests/web-upgrade-test.sh
          ./tests/web-upgrade-test.sh --cleanup

  test_web_wizard_mysql:
    name: Test WebCalendar wizard MySQL (Selenium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # The web image is 48 seconds of every one of these three jobs, all of
      # it recompiling the same PHP extensions from the same Dockerfile.
      # Built here with a layer cache so compose finds it already present and
      # skips its own build; the tag has to match the image: key in
      # docker/docker-compose-test-*.yml, which DockerImageTagTest checks.
      #
      # The three jobs share one cache scope on purpose: a cold cache means
      # all three build, which is what happens today, and a warm one means
      # none of them do.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the web image with a layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-dev
          tags: webcalendar-test-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run MySQL installation and upgrade tests
        env:
          # A CI checkout has no live configuration to lose; the scripts
          # refuse to run without this so a developer's working copy does.
          WEBCAL_TEST_ALLOW_DESTRUCTIVE: '1'
        run: |
          chmod +x tests/run-mysql-install-tests.sh
          ./tests/run-mysql-install-tests.sh

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-screenshots-mysql
          path: tests/screenshots/
          if-no-files-found: ignore

  test_web_wizard_postgresql:
    name: Test WebCalendar wizard PostgreSQL (Selenium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # The web image is 48 seconds of every one of these three jobs, all of
      # it recompiling the same PHP extensions from the same Dockerfile.
      # Built here with a layer cache so compose finds it already present and
      # skips its own build; the tag has to match the image: key in
      # docker/docker-compose-test-*.yml, which DockerImageTagTest checks.
      #
      # The three jobs share one cache scope on purpose: a cold cache means
      # all three build, which is what happens today, and a warm one means
      # none of them do.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the web image with a layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile-dev
          tags: webcalendar-test-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PostgreSQL installation and upgrade tests
        env:
          # A CI checkout has no live configuration to lose; the scripts
          # refuse to run without this so a developer's working copy does.
          WEBCAL_TEST_ALLOW_DESTRUCTIVE: '1'
        run: |
          chmod +x tests/run-postgresql-install-tests.sh
