        with:
          name: selenium-screenshots-postgresql
          path: tests/screenshots/
          if-no-files-found: ignore

  test_web_wizard_sqlite:
    name: Test WebCalendar wizard SQLite (Selenium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # The web image is 48 seconds of every one of these three jobs, all of
      # it recompiling the same PHP extensions from the same Dockerfile.
      # Built here with a layer cache so compose finds it already present and
      # skips its own build; the tag has to match the image: key in
      # docker/docker-compose-test-*.yml, which DockerImageTagTest checks.
      #
      # The three jobs share one cache scope on purpose: a cold cache means
      # all three build, which is what happens today, and a warm one means
      # none of them do.
      - name: Set up Docker Buildx
