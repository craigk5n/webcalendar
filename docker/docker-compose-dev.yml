# The database and the webcalendar user's privileges are created
# automatically on first startup by docker/mysql-init.sql, which is mounted
# into the mariadb container's /docker-entrypoint-initdb.d. No manual grant
# step is required.
#
#   If you need shell access on the webserver container running WebCalendar, you can use
#   the following command:
#     docker compose -f docker/docker-compose-dev.yml exec webcalendar /bin/sh

version: '3.1'

services:

  db:
    image: mariadb:11.4
    container_name: webcalendar-db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql # Mount the initialization script
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_ROOT_PASSWORD=Webcalendar.1
      - MYSQL_PASSWORD=Webcalendar.1
      - MYSQL_DATABASE=webcalendar_php81
      - MYSQL_USER=webcalendar
    restart: unless-stopped

  webcalendar:
    build:
      context: ..
      dockerfile: docker/Dockerfile-dev
    depends_on:
      - db
    ports:
      - 8080:80
    volumes:
      - ..:/var/www/html/
    # install password is WebCalendar.1
    # use the following to generate your password hash (replace "WebCalendar.1 with your password):
    # php -r "echo md5('Webcalendar.1');"
    environment:
      - WEBCALENDAR_USE_ENV=true
      - WEBCALENDAR_INSTALL_PASSWORD=b97f7de5f4b20eb6e474bb18b040b369
      - WEBCALENDAR_DB_TYPE=mysqli
      - WEBCALENDAR_DB_DATABASE=webcalendar_php81
      - WEBCALENDAR_DB_LOGIN=webcalendar
      - WEBCALENDAR_DB_PASSWORD=Webcalendar.1
      - WEBCALENDAR_DB_HOST=db
      - WEBCALENDAR_DB_PERSISTENT=true
      - WEBCALENDAR_USER_INC=user.php
      - WEBCALENDAR_MODE=dev

  #selenium-chrome:
